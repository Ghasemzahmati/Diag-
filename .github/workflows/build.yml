name: Build Diagnostic APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Build Project & Generate APK
        run: |
          # ساخت اسکلت کامل پروژه
          flutter create --org com.autodiag.app --project-name can_diag_app app_build
          
          # کپی فایل برنامه
          cp lib/main.dart app_build/lib/main.dart
          
          cd app_build
          
          # افزودن مستقیم پکیج‌ها با هماهنگی کامل
          flutter pub add usb_serial permission_handler cupertino_icons
          
          # تنظیم دسترسی USB در منیفست
          sed -i '/<\/application>/i <intent-filter><action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" /></intent-filter>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i <uses-feature android:name="android.hardware.usb.host" />' android/app/src/main/AndroidManifest.xml
          
          # ساخت APK نهایی
          flutter build apk --release

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: CAN-Diag-Pro-Release-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
          
