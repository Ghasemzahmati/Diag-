name: Build Diagnostic APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Generate Fresh Project & Build
        run: |
          # ساخت یک پروژه تمیز با ساختار کامل اندروید
          flutter create --org com.candlag.app diag_app
          
          # کپی کردن کد برنامه اصلی داخل پروژه جدید
          cp lib/main.dart diag_app/lib/main.dart
          cp pubspec.yaml diag_app/pubspec.yaml
          
          cd diag_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAN-Diag-Pro-APK
          path: diag_app/build/app/outputs/flutter-apk/app-release.apk
          
